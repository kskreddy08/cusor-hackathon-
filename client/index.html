<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>Nearby — Anonymous WiFi Chat</title>
    <script>
      (function () {
        var host = location.hostname;
        var cloud = location.protocol === 'https:' || /vercel\.app|github\.io|pages\.dev|netlify\.app/i.test(host);
        if (!cloud) return;
        try { sessionStorage.setItem('nearby-auto-join', 'lounge'); } catch (e) {}
        var saved = null;
        try { saved = localStorage.getItem('nearby-server'); } catch (e) {}
        if (saved && saved.indexOf('http://') === 0 && saved.indexOf('loca.lt') === -1) {
          location.replace(saved);
          return;
        }
        location.replace('http://nearby.local:3847');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
